<script>
(function () {
  "use strict";
  var data = JSON.parse(document.getElementById("macro-search-index").textContent);
  var input = document.getElementById("q"), out = document.getElementById("out"), hint = document.getElementById("hint");
  /* 注意：本页脚本内不得出现「href 接双引号」的字样（发布门禁的死链正则会扫进 script 文本）——链接一律 DOM API 建。 */
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function render(q) {
    var terms = q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    var hits = [];
    data.forEach(function (e) {
      var hay = (e.n + " " + e.t + " " + e.p + " " + e.kw.join(" ")).toLowerCase();
      if (terms.every(function (t) { return hay.indexOf(t) >= 0; })) hits.push(e);
    });
    hint.textContent = terms.length ? "命中 " + hits.length + " 条" : "输入关键词过滤（当前列出全部 " + data.length + " 条）";
    out.textContent = "";
    hits.forEach(function (e) {
      var li = el("li");
      var head = el("div", "r-head");
      var a = el("a"); /* C8 修复：标题不进 textContent——下方再 append r-num 与标题文本节点，旧写法双渲染「标题 0001 标题」 */
      a.setAttribute("href", "../" + e.f);
      a.appendChild(el("span", "r-num", e.n));
      a.appendChild(document.createTextNode(e.t));
      head.appendChild(a);
      head.appendChild(el("span", "r-phase", e.p || ""));
      li.appendChild(head);
      var secs = terms.length ? e.kw.filter(function (k) {
        var kl = k.toLowerCase();
        return terms.some(function (t) { return kl.indexOf(t) >= 0; });
      }).slice(0, 4) : e.kw.slice(0, 3);
      if (secs.length) li.appendChild(el("div", "r-secs", "节：" + secs.join(" · ")));
      out.appendChild(li);
    });
    if (!hits.length && terms.length) {
      out.appendChild(el("li", null, "没有命中——试试更短的词，或回课程主页按阶段浏览。"));
    }
  }
  input.addEventListener("input", function () { render(input.value); });
  render("");
})();
</script>
